spring.application.name=server
server.port=8080
spring.main.web-application-type=servlet
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
management.endpoints.web.exposure.include=health,info,metrics,loggers
logging.level.root=INFO
logging.level.ru.seed.server=INFO
spring.config.import=optional:file:.env[.properties],optional:configtree:/run/secrets/
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seed}
spring.datasource.username=${DB_USERNAME:seed}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=${JWT_TTL:PT12H}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
logging.pattern.correlation=[%X{requestId:-}] 
